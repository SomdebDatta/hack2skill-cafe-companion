<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loom &amp; Bean — Staff Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/staff.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark">◉</span><span>Loom &amp; Bean</span>
    <span class="board-tag">Staff board</span></div>
  <div class="topbar-right">
    <span class="live"><i></i>live</span>
    <a class="linkout" href="/" target="_blank">Customer view ↗</a>
  </div>
</header>

<div class="stats">
  <div class="stat"><span class="k" id="sQueue">—</span><span class="l">in the queue</span></div>
  <div class="stat"><span class="k" id="sWork">—</span><span class="l">minutes of work</span></div>
  <div class="stat"><span class="k" id="sRush">—</span><span class="l">right now</span></div>
  <div class="stat"><span class="k" id="sScore">—</span><span class="l">happy today</span></div>
</div>

<main class="layout staff-layout">
  <!-- ------------------------------------------------------- queue -->
  <section class="panel">
    <div class="panel-head">
      <h1>Prep queue</h1>
      <span class="muted small">longest wait first</span>
    </div>
    <div id="queue"></div>
    <div class="panel-head" style="margin:22px 0 10px">
      <h2>Done</h2><span class="muted small" id="doneCount"></span>
    </div>
    <div id="done"></div>
  </section>

  <!-- -------------------------------------------------------- room -->
  <aside class="side">
    <section class="panel">
      <div class="panel-head"><h2>What to do now</h2>
        <span class="model-chip" id="digestChip">Gemini</span></div>
      <div id="digest" class="digest"><p class="muted small">Reading today's feedback…</p></div>
      <button class="ghost" id="refreshDigest">Re-read feedback</button>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>The room</h2><span class="muted small" id="fbCount"></span></div>
      <div class="gauge"><div class="gauge-fill" id="gaugeFill"></div></div>
      <div class="gauge-legend">
        <span><b id="upCount">0</b> good</span><span><b id="downCount">0</b> off</span>
      </div>
      <div class="themes" id="themes"></div>
      <div class="recent" id="recent"></div>
    </section>
  </aside>
</main>

<script src="/static/staff.js"></script>
</body>
</html>
