<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loom &amp; Bean — Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark">◉</span>
    <span>Loom &amp; Bean</span>
  </div>
  <div class="topbar-right">
    <span class="rush" id="rush">—</span>
    <label class="who">
      <span>Signed in</span>
      <select id="who"></select>
    </label>
    <a class="linkout" href="/staff" target="_blank">Staff board ↗</a>
  </div>
</header>

<main class="layout">
  <!-- ---------------------------------------------------------- chat -->
  <section class="panel chat-panel">
    <div class="panel-head">
      <h1>Order</h1>
      <span class="model-chip" id="modelChip">—</span>
    </div>

    <div class="chat" id="chat"></div>

    <div class="suggestions" id="suggestions"></div>

    <form class="composer" id="composer" autocomplete="off">
      <input id="input" placeholder="Something warm, not too sweet…" autocomplete="off">
      <button id="send" type="submit" aria-label="Send">→</button>
    </form>
  </section>

  <!-- ---------------------------------------------------------- side -->
  <aside class="side">
    <section class="panel" id="orderPanel" hidden>
      <div class="panel-head"><h2>Your order</h2><span class="order-id" id="orderId"></span></div>
      <div class="status-track" id="statusTrack"></div>
      <div class="eta-big"><span id="etaNum">—</span><span class="eta-unit">min</span></div>
      <p class="eta-why" id="etaWhy"></p>
      <div class="feedback" id="feedbackBox" hidden>
        <p class="fb-prompt">How was it?</p>
        <div class="fb-row">
          <button class="fb up" data-rating="up">👍 Good</button>
          <button class="fb down" data-rating="down">👎 Off</button>
        </div>
        <input id="fbComment" placeholder="Anything to tell the team?" autocomplete="off">
        <p class="fb-thanks" id="fbThanks" hidden>Thanks — the team can see that now.</p>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Cart</h2><span class="muted" id="cartCount"></span></div>
      <div id="cart"></div>
      <button class="primary" id="placeBtn" disabled>Place order</button>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Best time to visit</h2></div>
      <div class="spark" id="spark"></div>
      <p class="muted small" id="sparkNote"></p>
    </section>
  </aside>
</main>

<script src="/static/app.js"></script>
</body>
</html>
